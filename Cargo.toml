[package]
name = "bits-style"
version = "0.3.0"
edition = "2024"
description = "Bits’s Coding Style and reference scanner"
license = "MIT"
repository = "https://github.com/12bitsD/bits-style"

[[bin]]
name = "bits"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.61.2", default-features = false }
predicates = "3.1.4"
tempfile = "3.27.0"
